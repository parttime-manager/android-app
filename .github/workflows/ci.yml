name: Android CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Block committed credentials
        shell: bash
        run: |
          if git ls-files | grep -E '(^|/)(local\.properties|google-services\.json|.*\.(jks|keystore))$'; then
            echo "Local configuration, credentials and signing keys must not be committed."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Build, test and lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug
