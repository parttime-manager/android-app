name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - run: ./gradlew testDebugUnitTest

  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Block committed credentials
        run: |
          if git ls-files | grep -E '(^|/)(google-services\.json|.*\.(jks|keystore))$'; then
            echo "Credentials and signing keys must not be committed."
            exit 1
          fi

  # 태그(v*) 푸시에서만 서명된 릴리스 APK 를 만든다.
  # 시크릿: KEYSTORE_BASE64(base64 인코딩한 .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, secret-guard]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - name: Restore keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
